name: MarkLLM service image

on:
  pull_request:
    paths:
      - "service/Dockerfile.markllm-service"
      - "service/scripts/**"
      - ".github/workflows/markllm-service.yml"
  push:
    branches: [main]
    paths:
      - "service/Dockerfile.markllm-service"
      - "service/scripts/**"
      - ".github/workflows/markllm-service.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build MarkLLM-enabled service image (no push)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: service
          file: service/Dockerfile.markllm-service
          push: false
          tags: watermarks-remover:markllm-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
